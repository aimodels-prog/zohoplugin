services:
  - type: web
    name: zoho-books-mcp
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: ZOHO_CLIENT_ID
        sync: false
      - key: ZOHO_CLIENT_SECRET
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: ALLOWED_EMAIL_DOMAINS
        sync: false
      - key: BUILD_ID
        sync: false
      - key: ZOHO_READ_ONLY
        value: "true"
